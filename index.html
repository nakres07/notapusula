<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0d1118">
<title>NotaPusula — Müzisyenler için akıllı arama</title>
<style>
:root{--bg:#0d1118;--panel:#151b24;--line:#28313e;--text:#f2f5f9;--muted:#9ba8b8;--lime:#d4f36a;--purple:#9b87ff;--orange:#ffb86b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#25213b 0,transparent 36%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1220px;margin:auto;padding:26px 30px 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:64px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.5px;font-size:20px}.logo{width:36px;height:36px;border-radius:11px;background:var(--lime);color:#12170b;display:grid;place-items:center;font-weight:900;font-size:21px}.topright{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.pill{border:1px solid var(--line);border-radius:30px;padding:7px 12px}.hero{max-width:790px;margin:0 auto 36px;text-align:center}.eyebrow{text-transform:uppercase;letter-spacing:2px;color:var(--lime);font-size:11px;font-weight:800}.hero h1{font-size:clamp(36px,6vw,65px);line-height:1.04;letter-spacing:-2.8px;margin:14px 0 16px}.hero h1 span{color:var(--lime)}.hero p{color:var(--muted);font-size:17px;max-width:640px;margin:auto}.searchbox{max-width:900px;margin:30px auto 15px;display:flex;align-items:center;gap:12px;background:#f5f7fa;padding:9px 10px 9px 20px;border-radius:17px;box-shadow:0 18px 55px #0005}.searchicon{color:#747e8b;font-size:20px}.searchbox input{border:0;outline:0;min-width:0;flex:1;background:transparent;color:#151a21;font-size:15px}.searchbox button{border:0;background:#151a21;color:white;font-weight:700;padding:13px 22px;border-radius:11px}.quick{color:var(--muted);font-size:12px}.quick button{border:1px solid #353d49;color:#dce3eb;background:transparent;border-radius:20px;padding:5px 10px;margin:0 3px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:42px 0 16px}.toolbar h2{font-size:19px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:3px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select{background:var(--panel);color:#dce3eb;border:1px solid var(--line);border-radius:9px;padding:9px 11px}.content{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}.results{display:grid;gap:9px}.song{background:linear-gradient(105deg,#171e28,#141a22);border:1px solid var(--line);border-radius:14px;padding:15px 17px;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:14px;align-items:center;cursor:pointer;transition:.18s}.song:hover,.song.active{border-color:#83964f;background:#1b2228;transform:translateY(-1px)}.cover{width:42px;height:42px;background:#27303b;border-radius:11px;display:grid;place-items:center;color:var(--lime);font-size:18px}.song h3{font-size:15px;margin:0 0 3px}.song p{margin:0;color:var(--muted);font-size:12px}.tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.tag{font-size:10px;color:#b9c3ce;border:1px solid #333d4b;border-radius:20px;padding:3px 8px}.tag.green{color:var(--lime);border-color:#55633a}.bpm{font-size:12px;color:var(--muted);text-align:right}.bpm strong{display:block;color:var(--text);font-size:18px}.detail{position:sticky;top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.detailhead{display:flex;justify-content:space-between;align-items:start}.detail h2{font-size:21px;line-height:1.2;margin:0}.detail .artist{color:var(--muted);margin:5px 0 18px}.xbtn{border:0;background:none;color:var(--muted);font-size:20px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#10151c;border:1px solid #252d38;border-radius:10px;padding:11px}.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px}.stat b{font-size:17px}.detailsection{margin-top:18px}.detailsection h4{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1.1px;margin:0 0 8px}.chords{font:700 16px ui-monospace,monospace;color:var(--lime);letter-spacing:2px}.instrument{padding:9px 0;border-top:1px solid #27303c;color:#d2dae3;font-size:12px}.instrument b{color:var(--text)}.export{display:flex;width:100%;justify-content:center;align-items:center;gap:8px;margin-top:18px;background:var(--lime);color:#141a0d;border:0;border-radius:10px;padding:12px;font-weight:800}.note{font-size:10px;color:var(--muted);text-align:center;margin:9px 0 0}.empty{color:var(--muted);padding:40px;text-align:center;border:1px dashed var(--line);border-radius:14px}.footer{margin-top:42px;border-top:1px solid var(--line);padding-top:19px;color:#7f8a99;font-size:12px;display:flex;justify-content:space-between}.footer b{color:#cad2dd}.modal{display:none}.print-only{display:none}
@media(max-width:850px){.content{grid-template-columns:1fr}.detail{position:static}.toolbar{align-items:flex-start;flex-direction:column}.top{margin-bottom:42px}}@media(max-width:520px){.wrap{padding:18px 15px 40px}.topright .pill{display:none}.hero h1{letter-spacing:-1.6px}.hero p{font-size:15px}.searchbox{padding-left:13px}.searchbox button{padding:12px 14px}.song{grid-template-columns:37px minmax(0,1fr) auto;padding:12px;gap:10px}.cover{width:37px;height:37px}.footer{display:block}.footer span{display:block;margin-top:6px}}
@media print{body{background:white;color:#111}.wrap{max-width:none;padding:0}.top,.hero,.toolbar,.results,.footer,.xbtn,.export,.note{display:none!important}.content{display:block}.detail{display:block!important;position:static;background:white;color:#111;border:0;padding:0}.detail h2,.stat b,.instrument b{color:#111}.detail .artist,.detailsection h4,.stat small{color:#555}.stat{background:white;border-color:#bbb}.instrument{border-color:#ddd;color:#222}.chords{color:#111}.print-only{display:block!important;margin-bottom:14px}.print-only small{color:#555}}
</style>
</head>
<body><div class="wrap">
<header class="top"><div class="brand"><div class="logo">♫</div>NotaPusula</div><div class="topright"><span class="pill">🎸 Müzisyenlerin çalışma alanı</span><span>TR</span></div></header>
<section class="hero"><div class="eyebrow">Şarkı bilgisi, tek yerde</div><h1>Müziğini <span>anla.</span><br>Tek tıkla keşfet.</h1><p>Akorları, BPM’i, türü ve enstrüman detaylarını ara. Çalışma notlarını PDF olarak dışa aktar.</p>
<form class="searchbox" id="searchForm"><span class="searchicon">⌕</span><input id="searchInput" type="search" placeholder="Şarkı, sanatçı, tür veya akor ara…" aria-label="Şarkı ara"><button type="submit">Ara <span>→</span></button></form><div class="quick">Örnek aramalar: <button type="button" data-query="Dönence">Dönence</button><button type="button" data-query="rock">Rock</button><button type="button" data-query="Am">Am akoru</button></div></section>
<div class="toolbar"><div><h2>Keşfet</h2><div class="sub" id="resultCount">Şarkı kataloğu</div></div><div class="filters"><select id="genreFilter" aria-label="Tür filtresi"><option value="">Tüm türler</option></select><select id="sortBy" aria-label="Sıralama"><option value="title">Şarkı adına göre</option><option value="bpm">BPM: düşükten yükseğe</option></select></div></div>
<main class="content"><section class="results" id="results" aria-live="polite"></section><aside class="detail" id="detail"></aside></main>
<footer class="footer"><b>NotaPusula</b><span>Demo kataloğu • Veriler örnek amaçlıdır</span></footer></div>
<script>
const songs=[
 {title:'Dönence',artist:'Barış Manço',year:1978,genre:'Anadolu Rock',bpm:92,key:'Am',meter:'4/4',chords:'Am · G · F · E',instruments:[['Elektro gitar','Temiz ton, hafif chorus; ana motif arpejle çalınır.'],['Bas gitar','Kök notaları takip eden, ölçü sonunda geçiş yapan çizgi.'],['Klavye','Atmosferik pad ve geri planda uzun sustain.'],['Davul','Orta tempolu, sade rock groove; tom geçişleri.']]},
 {title:'Bir Derdim Var',artist:'Mor ve Ötesi',year:2004,genre:'Alternatif Rock',bpm:128,key:'Em',meter:'4/4',chords:'Em · C · G · D',instruments:[['Elektro gitar','Distortion; kıtalarda palm mute, nakaratta açık akorlar.'],['Bas gitar','Gitar köklerini izleyen güçlü sekizlikler.'],['Davul','Enerjik rock vuruşu, nakaratta crash.']]},
 {title:'Senden Daha Güzel',artist:'Duman',year:2002,genre:'Alternatif Rock',bpm:104,key:'Bm',meter:'4/4',chords:'Bm · G · D · A',instruments:[['Elektro gitar','Crunch ton; kısa ve net downstroke ritim.'],['Bas gitar','Orta frekansta belirgin, gitarla birlikte sıkı.'],['Davul','Düz rock groove; trampet 2 ve 4.']]},
 {title:'Aşkın Olayım',artist:'Simge',year:2018,genre:'Pop',bpm:120,key:'F#m',meter:'4/4',chords:'F#m · D · A · E',instruments:[['Klavye','Parlak synth katmanları ve ritmik akor vuruşları.'],['Bas gitar','Elektronik pop karakterinde tekrarlayan bas ostinato.'],['Davul','Dörtte dört kick, elektronik clap ve hi-hat.']]},
 {title:'Gülpembe',artist:'Barış Manço',year:1981,genre:'Anadolu Rock',bpm:78,key:'Em',meter:'4/4',chords:'Em · Am · B7 · Em',instruments:[['Akustik gitar','Arpej eşlik; yumuşak pena veya parmak tekniği.'],['Bas gitar','Sakin kök-beşli yürüyüşü.'],['Klavye','Yaylı dokusu ve melodik cevaplar.']]},
 {title:'Yalnızlık Senfonisi',artist:' kuğu',year:1996,genre:'Türkçe Rock',bpm:86,key:'Dm',meter:'4/4',chords:'Dm · Bb · F · C',instruments:[['Elektro gitar','Temiz ton ve uzun reverb; nakaratta geniş akorlar.'],['Bas gitar','Melodik geçişlerle desteklenen sade çizgi.'],['Davul','Yarım zaman hissi, kontrollü dinamik.']]}
];
const $=s=>document.querySelector(s);let active=songs[0];const results=$('#results');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fillGenres(){[...new Set(songs.map(s=>s.genre))].sort().forEach(g=>$('#genreFilter').insertAdjacentHTML('beforeend',`<option>${esc(g)}</option>`))}
function render(){const q=$('#searchInput').value.trim().toLocaleLowerCase('tr'),g=$('#genreFilter').value,sort=$('#sortBy').value;let list=songs.filter(s=>(!g||s.genre===g)&&(!q||[s.title,s.artist,s.genre,s.key,s.chords,...s.instruments.flat()].join(' ').toLocaleLowerCase('tr').includes(q)));if(sort==='bpm')list.sort((a,b)=>a.bpm-b.bpm);else list.sort((a,b)=>a.title.localeCompare(b.title,'tr'));$('#resultCount').textContent=`${list.length} şarkı bulundu · Örnek katalog`;results.innerHTML=list.length?list.map(s=>`<article class="song ${s===active?'active':''}" tabindex="0" role="button" data-title="${esc(s.title)}"><div class="cover">♫</div><div><h3>${esc(s.title)}</h3><p>${esc(s.artist)} · ${s.year}</p><div class="tags"><span class="tag green">${esc(s.genre)}</span><span class="tag">Ton ${esc(s.key)}</span></div></div><div class="bpm"><strong>${s.bpm}</strong>BPM</div></article>`).join(''):'<div class="empty">Bu aramayla eşleşen şarkı yok. Başka bir kelime deneyin.</div>';results.querySelectorAll('.song').forEach(el=>{const fn=()=>selectSong(el.dataset.title);el.addEventListener('click',fn);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}})});if(!list.includes(active)&&list.length){active=list[0];renderDetail()}}
function renderDetail(){const s=active;$('#detail').innerHTML=`<div class="print-only"><b>NotaPusula — Şarkı çalışma kartı</b><br><small>Bu içerik örnek katalog verilerinden oluşturulmuştur.</small></div><div class="detailhead"><div><h2>${esc(s.title)}</h2><div class="artist">${esc(s.artist)} · ${s.year}</div></div><button class="xbtn" aria-label="Detay">⋯</button></div><div class="statgrid"><div class="stat"><small>BPM</small><b>${s.bpm}</b></div><div class="stat"><small>Ton</small><b>${esc(s.key)}</b></div><div class="stat"><small>Ölçü</small><b>${esc(s.meter)}</b></div></div><div class="detailsection"><h4>Akor dizilimi · ${esc(s.genre)}</h4><div class="chords">${esc(s.chords)}</div></div><div class="detailsection"><h4>Enstrüman notları</h4>${s.instruments.map(i=>`<div class="instrument"><b>${esc(i[0])}</b><br>${esc(i[1])}</div>`).join('')}</div><button class="export" id="exportPdf">↓ &nbsp;PDF olarak dışa aktar</button><p class="note">Tarayıcı yazdır penceresinde “PDF olarak kaydet” seçin.</p>`;$('#exportPdf').addEventListener('click',()=>window.print())}
function selectSong(title){active=songs.find(s=>s.title===title);render();renderDetail()}
$('#searchForm').addEventListener('submit',e=>{e.preventDefault();render()});$('#searchInput').addEventListener('input',render);$('#genreFilter').addEventListener('change',render);$('#sortBy').addEventListener('change',render);document.querySelectorAll('.quick button').forEach(b=>b.addEventListener('click',()=>{$('#searchInput').value=b.dataset.query;render()}));fillGenres();render();renderDetail();
</script></body></html>
